# Configuration Nginx durcie pour AgoraExam (Production Standard)
# Conforme OWASP Top 10, CWE-1021 et Guide DevSecOps

pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Masquage de la version Nginx (CWE-200)
    server_tokens off;

    # Performance & Envoi de fichiers
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Compression Gzip sécurisée
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Stockage temporaire en espace non-privilégié
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp_path;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Journalisation sécurisée (format JSON standardisé)
    log_format json_combined escape=json
        '{"time_local":"$time_local",'
        '"client_ip":"$remote_addr",'
        '"request":"$request",'
        '"status": "$status",'
        '"bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"}';

    access_log /var/log/nginx/access.log json_combined;
    error_log /var/log/nginx/error.log warn;

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # ---------------------------------------------------------------------
        # Headers de Sécurité Durcis (Zero-Vulnerability Standard)
        # ---------------------------------------------------------------------
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=*, microphone=*, display-capture=*, fullscreen=*" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://cdn.jsdelivr.net https://storage.googleapis.com; img-src 'self' data: blob: https:; media-src 'self' blob:; object-src 'none'; base-uri 'self';" always;

        # Endpoint de Santé pour Kubernetes / Docker (Healthcheck probe)
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "OK\n";
        }

        # Cache immuable pour les assets statiques avec hash
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # Routage Single Page Application (SPA)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Interdiction absolue d'accéder aux fichiers cachés (.git, .env)
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}

