name: DevSecOps CI Quality & Security Gates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Principe du Moindre Privilège par défaut (Rule #5 DevSecOps)
permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. SCAN DE SECRETS & AUDIT DE DÉPENDANCES (SCA)
  # ---------------------------------------------------------------------------
  security-audit:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: NPM Dependency Audit (SCA)
        run: |
          npm audit --audit-level=high

  # ---------------------------------------------------------------------------
  # 2. VALIDATION DU CODE FRONTEND (TYPECHECK & BUILD)
  # ---------------------------------------------------------------------------
  frontend-check:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Production Build Vite
        run: npm run build

  # ---------------------------------------------------------------------------
  # 3. VALIDATION DU CODE BACKEND RUST (CLIPPY & CHECK)
  # ---------------------------------------------------------------------------
  rust-check:
    name: Rust Security & Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev build-essential curl wget file

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust Cargo Check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust Clippy Strict Linter
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

  # ---------------------------------------------------------------------------
  # 4. VALIDATION DE L'IMAGE DOCKER (BUILD TEST)
  # ---------------------------------------------------------------------------
  docker-check:
    name: Container Build Verification
    runs-on: ubuntu-latest
    needs: [security-audit, frontend-check]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Dry-Run Verification)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: agoraexam:test

