apiVersion: apps/v1
kind: Deployment
metadata:
  name: agoraexam
  namespace: default
  labels:
    app.kubernetes.io/name: agoraexam
    app.kubernetes.io/instance: production
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/part-of: agoraexam-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: agoraexam
  template:
    metadata:
      labels:
        app: agoraexam
    spec:
      # Confinement de sécurité durci (Pod Security Standard: Restricted)
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agoraexam
          image: agoraexam:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: log-volume
              mountPath: /var/log/nginx
          resources:
            limits:
              cpu: "500m"
              memory: 256Mi
            requests:
              cpu: "100m"
              memory: 64Mi

          # Sondes de santé triples (Zero-Downtime Guarantee)
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 10
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

      volumes:
        - name: tmp-volume
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: log-volume
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi

---
apiVersion: v1
kind: Service
metadata:
  name: agoraexam-service
  namespace: default
  labels:
    app: agoraexam
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app: agoraexam

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agoraexam-netpol
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: agoraexam
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

